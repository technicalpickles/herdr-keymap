id = "tds.keymap"
name = "Keymap Palette"
version = "0.7.1"
min_herdr_version = "0.7.4"
description = "List herdr keybindings in a popup and run the ones with a CLI equivalent"
platforms = ["linux", "macos"]

[[build]]
command = ["npm", "ci"]

[[panes]]
id = "palette"
title = "Keybindings"
placement = "popup"
width = "80%"
height = 20
command = ["node", "src/keymap.ts"]

[[actions]]
id = "open_palette"
title = "Open keybindings palette"
contexts = ["workspace"]
command = ["bash", "open_palette.sh"]
